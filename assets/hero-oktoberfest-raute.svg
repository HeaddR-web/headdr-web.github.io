<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img"
     aria-label="Weiß-blaues bayrisches Rautenmuster im warmen Abendlicht">
  <!--
    Übergangs-Hero für /oktoberfest/ — dekoratives Rautenmuster in Weiß-Blau,
    auf die BeThatHost-Palette abgestimmt (Sand statt Reinweiß, gedecktes Blau).
    Ersetzt den alten Platzhalter, der sichtbar "Hero-Bild folgt" auf die Seite
    geschrieben hat. Wird durch das generierte 3:2-Foto ersetzt, sobald es da ist.
  -->
  <defs>
    <pattern id="wiesn-raute" width="160" height="160" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45) translate(20 20)">
      <rect width="160" height="160" fill="#f7f1e4" />
      <rect width="80" height="80" fill="#5f83ab" />
      <rect x="80" y="80" width="80" height="80" fill="#5f83ab" />
    </pattern>

    <!-- Warmes Abendlicht von oben links, das nach unten in Sand ausläuft. -->
    <linearGradient id="abendlicht" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0"    stop-color="#ffe9c4" stop-opacity="0.55" />
      <stop offset="0.45" stop-color="#f3dcc3" stop-opacity="0.22" />
      <stop offset="1"    stop-color="#a9824a" stop-opacity="0.30" />
    </linearGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.55" stop-color="#241f1a" stop-opacity="0" />
      <stop offset="1"    stop-color="#241f1a" stop-opacity="0.24" />
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#wiesn-raute)" />
  <rect width="1200" height="800" fill="url(#abendlicht)" />
  <rect width="1200" height="800" fill="url(#vignette)" />

  <!-- Schmale Goldkante unten, gleiche Rolle wie die Bildkante der Foto-Heros. -->
  <rect y="792" width="1200" height="8" fill="#a9824a" opacity="0.55" />
</svg>
