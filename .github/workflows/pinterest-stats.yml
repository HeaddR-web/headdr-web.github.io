name: Pinterest-Statistik

# Holt jede Woche die Zahlen aller Pins (Impressionen, Gemerkt, Klicks,
# Klicks zur Seite) und schreibt pinterest/STATISTIK.md + stats/latest.json.
# Nur lesend gegenueber Pinterest; nutzt dieselben drei Secrets wie
# pinterest-publish.yml. Logik: scripts/pinterest_stats.py

on:
  schedule:
    - cron: "0 7 * * 1"   # montags ~07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pinterest-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zahlen abholen
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
        run: python scripts/pinterest_stats.py

      - name: Bericht committen
        run: |
          if [[ -n "$(git status --porcelain pinterest/STATISTIK.md pinterest/stats)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pinterest/STATISTIK.md pinterest/stats
            git commit -m "Pinterest: Statistik aktualisieren [skip ci]"
            git pull --rebase
            git push
          else
            echo "Keine Aenderung."
          fi
