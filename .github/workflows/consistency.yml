name: Consistency Check

# Guardrail: blockt Design-Inkonsistenz automatisch bei jedem Push/PR.
# Prüft u.a.: nur eine zentrale /assets/style.css, keine Playfair/Inter-Reste,
# einheitliche Stylesheet-Pfade und Titel-Form. Logik: scripts/check-consistency.sh

on:
  push:
    branches: ["**"]
    paths:
      - "**/*.html"
      - "assets/style.css"
      - "assets/img/**"
      - "scripts/**"
      - ".github/workflows/consistency.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "assets/style.css"
      - "assets/img/**"
      - "scripts/**"
      - ".github/workflows/consistency.yml"
  workflow_dispatch: {}

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Punkt 17 (scripts/check-images.py) laedt scripts/build-images.py, das
      # Pillow braucht. Ohne diesen Schritt scheitert der Check mit
      # "ModuleNotFoundError: No module named 'PIL'" — und zwar erst in CI,
      # weil Pillow lokal meist schon installiert ist.
      - name: Python-Abhaengigkeiten
        run: python3 -m pip install --disable-pip-version-check --quiet -r scripts/requirements.txt
      - name: Konsistenz-Check
        run: bash scripts/check-consistency.sh
