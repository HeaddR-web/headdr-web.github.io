name: Pinterest auto-publish

# Postet vorbereitete Pins ueber die offizielle Pinterest-API (v5).
# Liest jede */pins/queue.json ausser cozy/ (abgekoppelt, siehe CLAUDE.md),
# veroeffentlicht die naechsten offenen Pins, markiert sie als published und
# committet die aktualisierten Queues zurueck.
#
# Board-Zuordnung laeuft ueber Board-NAMEN in pinterest/boards.json — das
# Skript loest sie zur Laufzeit per API in IDs auf. Es braucht daher kein
# Secret pro Hub, nur die drei Auth-Secrets.

on:
  schedule:
    - cron: "0 9 * * *"   # taeglich ~09:00 UTC
    - cron: "0 17 * * *"  # taeglich ~17:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Was der Lauf tun soll"
        type: choice
        default: publish
        options:
          - publish              # normal posten
          - doctor               # nur pruefen: Token, Boards, Queue-Stand
          - dry-run              # zeigen, was gepostet wuerde
          - list-boards          # alle Boards mit ID ausgeben
          - mark-published-only  # offene Pins abhaken, OHNE zu posten
      max:
        description: "Max. Pins in diesem Lauf (leer = MAX_PER_RUN)"
        type: string
        default: ""

permissions:
  contents: write          # noetig, um die aktualisierten Queues zu committen

concurrency:
  group: pinterest-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish queued pins
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          # Optionales globales Fallback-Board, falls boards.json nicht greift.
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          MAX_PER_RUN: "5"
          MODE: ${{ inputs.mode || 'publish' }}
          MAX_OVERRIDE: ${{ inputs.max }}
        run: |
          # Kein "[[ … ]] && …" hier: unter "bash -e" (Actions-Standard) bricht
          # eine AND-Liste mit falscher Bedingung den ganzen Step ab.
          args=()
          if [[ "$MODE" != "publish" ]]; then
            args+=("--$MODE")
          fi
          if [[ -n "$MAX_OVERRIDE" ]]; then
            args+=(--max "$MAX_OVERRIDE")
          fi
          python scripts/pinterest_publish.py ${args[@]+"${args[@]}"}

      - name: Commit updated queues
        run: |
          if [[ -n "$(git status --porcelain '*/pins/queue.json')" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add */pins/queue.json
            git commit -m "Pinterest: mark published pins [skip ci]"
            git push
          else
            echo "Keine Queue-Aenderungen zu committen."
          fi
